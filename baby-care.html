  function renderProfileFacts() {
    const el = document.getElementById('helenaFacts');
    if (!el) return;
    if (profileFormState) { renderProfileForm(); return; }
    if (!babyProfile || !babyProfile.birth_date) { el.innerHTML = ''; return; }
    const p = babyProfile;
    const facts = [];
    if (p.sex) facts.push(['Sex', p.sex === 'girl' ? 'Girl' : 'Boy']);
    if (p.blood_type) facts.push(['Blood type', p.blood_type]);
    if (p.birth_weight_kg != null) facts.push(['Birth weight', p.birth_weight_kg + ' kg']);
    if (p.birth_length_cm != null) facts.push(['Birth length', p.birth_length_cm + ' cm']);
    const grid = facts.length
      ? `<div class="facts-grid">${facts.map(f => `<div class="fact"><div class="fact-label">${f[0]}</div><div class="fact-val">${esc(String(f[1]))}</div></div>`).join('')}</div>`
      : '';
    el.innerHTML = `<div class="section-label">Profile</div>${grid}
      <button class="helena-add-btn" onclick="openProfileForm()">Edit profile</button>`;
  }

  function openProfileForm() {
    const p = babyProfile || {};
    profileFormState = {
      name: p.name || 'Helena Amaya',
      birth_date: p.birth_date || '',
      birth_time: p.birth_time ? p.birth_time.slice(0, 5) : '',
      sex: p.sex || '',
      blood_type: p.blood_type || '',
      birth_weight_kg: p.birth_weight_kg != null ? String(p.birth_weight_kg) : '',
      birth_length_cm: p.birth_length_cm != null ? String(p.birth_length_cm) : '',
      photo: p.photo || null,
    };
    renderProfileFacts();
    requestAnimationFrame(() => { const n = document.getElementById('pf-name'); if (n) n.focus(); });
  }

  function closeProfileForm() { profileFormState = null; renderProfileFacts(); }

  function syncProfileFormState() {
    const f = profileFormState; if (!f) return;
    const g = id => document.getElementById(id);
    if (g('pf-name')) f.name = g('pf-name').value;
    if (g('pf-birthdate')) f.birth_date = g('pf-birthdate').value;
    if (g('pf-birthtime')) f.birth_time = g('pf-birthtime').value;
    if (g('pf-blood')) f.blood_type = g('pf-blood').value;
    if (g('pf-weight')) f.birth_weight_kg = g('pf-weight').value;
    if (g('pf-length')) f.birth_length_cm = g('pf-length').value;
  }

  function setProfileSex(s) { syncProfileFormState(); profileFormState.sex = (profileFormState.sex === s ? '' : s); renderProfileFacts(); }

  function renderProfileForm() {
    const f = profileFormState; if (!f) return;
    const el = document.getElementById('helenaFacts');
    const seg = (active, s, label) => `<button type="button" class="med-seg-btn ${active ? 'active' : ''}" onclick="setProfileSex('${s}')">${label}</button>`;
    const photo = f.photo ? `<img src="${f.photo}" alt="">` : `<div class="ph">${esc(helenaInitial())}</div>`;
    el.innerHTML = `
      <div class="section-label">${babyProfile ? 'Edit profile' : "Helena's profile"}</div>
      <div class="helena-form">
        <div class="helena-form-photo">
          ${photo}
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="med-seg-btn" onclick="pickPhoto()">${f.photo ? 'Change photo' : 'Add photo'}</button>
            ${f.photo ? `<button type="button" class="med-seg-btn" onclick="removePhoto()">Remove</button>` : ''}
          </div>
        </div>
        <div class="med-form-row"><label class="med-form-label">Name</label>
          <input type="text" class="med-input" id="pf-name" value="${esc(f.name)}" maxlength="60"></div>
        <div class="med-row-2">
          <div class="med-form-row" style="flex:1;"><label class="med-form-label">Birth date</label>
            <input type="date" class="med-input" id="pf-birthdate" value="${f.birth_date}"></div>
          <div class="med-form-row" style="flex:0 0 124px;"><label class="med-form-label">Birth time</label>
            <input type="time" class="med-input" id="pf-birthtime" value="${f.birth_time}"></div>
        </div>
        <div class="med-form-row"><label class="med-form-label">Sex</label>
          <div class="med-seg">${seg(f.sex === 'girl', 'girl', 'Girl')}${seg(f.sex === 'boy', 'boy', 'Boy')}</div></div>
        <div class="med-row-2">
          <div class="med-form-row" style="flex:1;"><label class="med-form-label">Birth weight (kg)</label>
            <input type="number" class="med-input" id="pf-weight" value="${esc(f.birth_weight_kg)}" step="0.01" min="0" placeholder="3.4"></div>
          <div class="med-form-row" style="flex:1;"><label class="med-form-label">Birth length (cm)</label>
            <input type="number" class="med-input" id="pf-length" value="${esc(f.birth_length_cm)}" step="0.1" min="0" placeholder="50"></div>
        </div>
        <div class="med-form-row"><label class="med-form-label">Blood type</label>
          <input type="text" class="med-input" id="pf-blood" value="${esc(f.blood_type)}" maxlength="6" placeholder="O+"></div>
        <div style="display:flex;gap:8px;margin-top:4px;">
          <button class="log-btn" onclick="submitProfileForm()">Save</button>
          <button class="log-btn btn-secondary" onclick="closeProfileForm()">Cancel</button>
        </div>
      </div>`;
  }

  async function submitProfileForm() {
    syncProfileFormState();
    const f = profileFormState; if (!f) return;
    if (!f.birth_date) { const bd = document.getElementById('pf-birthdate'); if (bd) bd.focus(); return; }
    const row = {
      session_key: getSessionKey(),
      name: (f.name || '').trim() || 'Helena Amaya',
      birth_date: f.birth_date,
      birth_time: f.birth_time || null,
      sex: f.sex || null,
      blood_type: (f.blood_type || '').trim() || null,
      birth_weight_kg: f.birth_weight_kg !== '' ? parseFloat(f.birth_weight_kg) : null,
      birth_length_cm: f.birth_length_cm !== '' ? parseFloat(f.birth_length_cm) : null,
      photo: f.photo || null,
      updated_at: new Date().toISOString(),
    };
    const { error } = await client.from('baby_profile').upsert(row, { onConflict: 'session_key' });
    if (!error) { profileFormState = null; await fetchHelena(); }
  }

  function pickPhoto() { document.getElementById('helenaPhotoInput').click(); }
  function removePhoto() { if (profileFormState) { profileFormState.photo = null; renderProfileFacts(); } }
  function handlePhotoFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const max = 640, scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const dataUrl = cv.toDataURL('image/jpeg', 0.82);
        if (!profileFormState) openProfileForm();
        profileFormState.photo = dataUrl;
        renderProfileFacts();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  document.getElementById('helenaPhotoInput').addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) handlePhotoFile(e.target.files[0]);
    e.target.value = '';
  });

  // ── Entry photos (milestones & growth measurements, via Supabase Storage) ──
  function entryPhotoPath(sessionKey, kind, id, token) {
    return `${sessionKey}/${kind}/${id}-${token}.jpg`;
  }
  function growthValueLabel(g) {
    const p = [];
    if (g.weight_kg != null) p.push(g.weight_kg + ' kg');
    if (g.height_cm != null) p.push(g.height_cm + ' cm');
    return p.join('  ·  ');
  }
  function kindInfo(kind) {
    return kind === 'growth' ? { table: 'growth_measurements' } : { table: 'milestones' };
  }
  function findEntry(kind, id) {
    return (kind === 'growth' ? growthList : milestonesList).find(x => x.id === id);
  }
  function entryPhotoUrl(path) {
    return client.storage.from('baby-photos').getPublicUrl(path).data.publicUrl;
  }
  function downscaleToBlob(file, max, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * scale);
          cv.height = Math.round(img.height * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          cv.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', quality);
        };
        img.onerror = reject; img.src = e.target.result;
      };
      reader.onerror = reject; reader.readAsDataURL(file);
    });
  }
  async function uploadEntryPhoto(kind, id, file) {
    try {
      const blob = await downscaleToBlob(file, 1280, 0.85);
      const token = Date.now().toString(36);
      const path = entryPhotoPath(getSessionKey(), kind, id, token);
      const { error } = await client.storage.from('baby-photos').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if (error) { console.warn('photo upload failed:', error.message); return null; }
      return path;
    } catch (e) { console.warn('photo process failed:', e); return null; }
  }
  async function deleteEntryStorage(path) {
    if (!path) return;
    try { await client.storage.from('baby-photos').remove([path]); } catch (e) {}
  }
  function pickEntryPhoto(kind, id) {
    entryPhotoTarget = { kind, id };
    document.getElementById('entryPhotoInput').click();
  }
  function entryThumb(kind, row) {
    if (row.photo_path) {
      return `<img class="entry-thumb" src="${entryPhotoUrl(row.photo_path)}" loading="lazy" alt="" onclick="openEntryViewer('${kind}', ${row.id})">`;
    }
    return `<button class="entry-thumb-add" onclick="pickEntryPhoto('${kind}', ${row.id})" aria-label="Add photo">📷</button>`;
  }
  document.getElementById('entryPhotoInput').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !entryPhotoTarget) return;
    const { kind, id } = entryPhotoTarget; entryPhotoTarget = null;
    const row = findEntry(kind, id);
    const oldPath = row ? row.photo_path : null;
    const newPath = await uploadEntryPhoto(kind, id, file);
    if (!newPath) return;
    const { error } = await client.from(kindInfo(kind).table).update({ photo_path: newPath }).eq('id', id);
    if (!error) { if (oldPath && oldPath !== newPath) deleteEntryStorage(oldPath); closeEntryViewer(); await fetchHelena(); }
  });

  // ── Entry photo viewer (lightbox) ──
  function openEntryViewer(kind, id) {
    const row = findEntry(kind, id);
    if (!row || !row.photo_path) return;
    const el = document.getElementById('entryPhotoViewer');
    el.innerHTML = `
      <div class="entry-viewer-backdrop" onclick="closeEntryViewer()"></div>
      <div class="entry-viewer-card">
        <img src="${entryPhotoUrl(row.photo_path)}" alt="">
        <div class="entry-viewer-actions">
          <button class="log-btn" onclick="shareEntry('${kind}', ${id})">Share ♡</button>
          <button class="log-btn btn-secondary" onclick="pickEntryPhoto('${kind}', ${id})">Replace</button>
          <button class="log-btn btn-secondary" onclick="removeEntryPhoto('${kind}', ${id})">Remove</button>
          <button class="log-btn btn-secondary" onclick="closeEntryViewer()">Close</button>
        </div>
      </div>`;
    el.style.display = 'flex';
  }
  function closeEntryViewer() {
    const el = document.getElementById('entryPhotoViewer');
    if (el) { el.style.display = 'none'; el.innerHTML = ''; }
  }
  async function removeEntryPhoto(kind, id) {
    const row = findEntry(kind, id);
    const { error } = await client.from(kindInfo(kind).table).update({ photo_path: null }).eq('id', id);
    if (!error) { if (row && row.photo_path) deleteEntryStorage(row.photo_path); closeEntryViewer(); await fetchHelena(); }
  }

  // ── Export / share keepsake card ──
  function loadImageEl(src) {
    return new Promise(resolve => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => resolve(null); i.src = src; });
  }

  async function drawKeepsakeCanvas() {
    const p = babyProfile;
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1012'); grad.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(W / 2, 380, 60, W / 2, 380, 540);
    glow.addColorStop(0, 'rgba(232,116,138,0.22)'); glow.addColorStop(1, 'rgba(232,116,138,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    const cx = W / 2, cyP = 380, r = 200;

    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cyP, r, 0, Math.PI * 2); ctx.clip();
    const img = p.photo ? await loadImageEl(p.photo) : null;
    if (img) {
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, cx - r, cyP - r, r * 2, r * 2);
    } else {
      ctx.fillStyle = '#1c1c1c'; ctx.fillRect(cx - r, cyP - r, r * 2, r * 2);
      ctx.fillStyle = '#e8748a'; ctx.font = '160px "DM Serif Display", serif';
      ctx.textBaseline = 'middle'; ctx.fillText(helenaInitial(), cx, cyP + 8); ctx.textBaseline = 'alphabetic';
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cyP, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(232,116,138,0.6)'; ctx.lineWidth = 6; ctx.stroke();

    ctx.fillStyle = '#f5f0ee'; ctx.font = '64px "DM Serif Display", serif';
    ctx.fillText(p.name, cx, 690);
    const age = computeAge(p.birth_date, new Date());
    ctx.fillStyle = '#e8748a'; ctx.font = '86px "DM Serif Display", serif';
    ctx.fillText(formatAge(age), cx, 800);
    ctx.fillStyle = '#9a9a9a'; ctx.font = '34px "DM Sans", sans-serif';
    ctx.fillText(bornLine(p), cx, 864);
    ctx.fillText(age.totalDays + ' days old', cx, 912);

    let latestW = p.birth_weight_kg != null ? parseFloat(p.birth_weight_kg) : null;
    let latestH = p.birth_length_cm != null ? parseFloat(p.birth_length_cm) : null;
    growthList.forEach(g => { if (g.weight_kg != null) latestW = parseFloat(g.weight_kg); if (g.height_cm != null) latestH = parseFloat(g.height_cm); });
    const statParts = [];
    if (latestW != null) statParts.push(latestW + ' kg');
    if (latestH != null) statParts.push(latestH + ' cm');
    if (statParts.length) { ctx.fillStyle = '#f5f0ee'; ctx.font = '40px "DM Sans", sans-serif'; ctx.fillText(statParts.join('     ·     '), cx, 1000); }

    const recent = milestonesList.slice(0, 3);
    let y = 1095;
    if (recent.length) {
      ctx.fillStyle = '#888'; ctx.font = '26px "DM Sans", sans-serif'; ctx.fillText('MILESTONES', cx, y); y += 48;
      ctx.fillStyle = '#d0c8c6'; ctx.font = '32px "DM Sans", sans-serif';
      recent.forEach(m => { ctx.fillText('♡ ' + m.title + '  ·  ' + shortDateLabel(m.achieved_on), cx, y); y += 48; });
    }

    ctx.fillStyle = 'rgba(232,116,138,0.7)'; ctx.font = '40px "DM Sans", sans-serif'; ctx.fillText('♡', cx, H - 60);
    return cv;
  }

  async function shareKeepsake() {
    if (!babyProfile || !babyProfile.birth_date) return;
    const cv = await drawKeepsakeCanvas();
    cv.toBlob(async blob => {
      if (!blob) return;
      const file = new File([blob], 'helena.png', { type: 'image/png' });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Helena ♡' });
          return;
        }
      } catch (e) { /* fall through to download */ }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'helena.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }

  // ── Per-entry share card ──
  function loadImageCORS(src) {
    return new Promise(resolve => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => resolve(i); i.onerror = () => resolve(null); i.src = src; });
  }
  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  async function drawEntryKeepsakeCanvas(kind, row) {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#1a1012'); grad.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    let imgBottom = 150;
    if (row.photo_path) {
      const img = await loadImageCORS(entryPhotoUrl(row.photo_path));
      if (img) {
        const pw = 880, ph = 880, px = (W - pw) / 2, py = 120, rad = 40;
        ctx.save(); roundRectPath(ctx, px, py, pw, ph, rad); ctx.clip();
        const side = Math.min(img.width, img.height), sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, px, py, pw, ph); ctx.restore();
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(232,116,138,0.5)'; roundRectPath(ctx, px, py, pw, ph, rad); ctx.stroke();
        imgBottom = py + ph;
      }
    }
    const title = kind === 'growth' ? growthValueLabel(row) : row.title;
    ctx.fillStyle = '#f5f0ee'; ctx.font = '66px "DM Serif Display", serif';
    ctx.fillText(title, W / 2, imgBottom + 110);
    const dateStr = kind === 'growth' ? row.measured_on : row.achieved_on;
    let y = imgBottom + 172;
    if (babyProfile && babyProfile.birth_date) {
      const age = computeAge(babyProfile.birth_date, new Date(dateStr + 'T00:00:00'));
      ctx.fillStyle = '#e8748a'; ctx.font = '44px "DM Sans", sans-serif'; ctx.fillText(formatAge(age), W / 2, y); y += 58;
    }
    ctx.fillStyle = '#9a9a9a'; ctx.font = '34px "DM Sans", sans-serif'; ctx.fillText(shortDateLabel(dateStr), W / 2, y);
    ctx.fillStyle = 'rgba(232,116,138,0.7)'; ctx.font = '40px "DM Sans", sans-serif'; ctx.fillText('♡', W / 2, H - 60);
    return cv;
  }
  async function shareEntry(kind, id) {
    const row = findEntry(kind, id); if (!row) return;
    const cv = await drawEntryKeepsakeCanvas(kind, row);
    cv.toBlob(async blob => {
      if (!blob) return;
      const file = new File([blob], 'helena-moment.png', { type: 'image/png' });
      try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Helena ♡' }); return; } } catch (e) {}
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'helena-moment.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }

  // ── Day rollover: when the local date changes while the page stays open,
  //    reload "today" data and the header so logs land on the correct day. ──
  function updateHeaderDate() {
    document.getElementById('headerDate').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function refreshForNewDayIfNeeded() {
    const today = localDayKey(new Date().toISOString());
    if (today === viewDayKey) return;
    // Don't clobber an open editor/form; retry on a later tick once it closes.
    if (editingFeedId || editingDiaperId || editingMedDoseId || medFormState) return;
    viewDayKey = today;
    updateHeaderDate();
    fetchTodayFeedings();
    fetchTodayDiapers();
    fetchLastDiaperChange();
    fetchMeds();
    if (babyProfile) renderHelenaHero();
  }

  // ══════════════════════════════════
  // INIT
  // ══════════════════════════════════

  viewDayKey = localDayKey(new Date().toISOString());
  updateHeaderDate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshForNewDayIfNeeded(); });

  fetchTodayFeedings();
  fetchTodayDiapers();
  fetchLastDiaperChange();
  fetchMeds();
  fetchHelena();
</script>

</body>
</html>
