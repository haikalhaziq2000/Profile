<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Helena Amaya ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f5f0ee;
      --muted: #5a5a5a;
      --muted2: #888;
      --rose: #e8748a;
      --rose-soft: rgba(232, 116, 138, 0.10);
      --rose-glow: rgba(232, 116, 138, 0.22);
      --purple: #c47adb;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ── */
    .header {
      flex-shrink: 0;
      padding: 54px 24px 14px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--rose);
      margin-top: 2px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .header-date {
      font-size: 11px;
      color: var(--muted2);
      margin-top: 5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tab-panel::-webkit-scrollbar { display: none; }

    .tab-panel.active { display: flex; }

    /* ── Tab bar ── */
    .tab-bar {
      flex-shrink: 0;
      display: flex;
      padding: 8px 16px env(safe-area-inset-bottom, 16px);
      background: var(--bg);
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 9px 8px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
      -webkit-appearance: none;
    }

    .tab-btn.active {
      background: var(--rose-soft);
      color: var(--rose);
    }

    .tab-svg {
      width: 22px;
      height: 22px;
    }

    /* ── Section & list shared styles ── */
    .section-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 4px 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 6px;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .item-time {
      font-family: 'DM Serif Display', serif;
      font-size: 19px;
      color: var(--text);
    }

    .item-detail {
      flex: 1;
      margin-left: 12px;
      font-size: 12px;
      color: var(--muted2);
    }

    .item-value {
      font-size: 14px;
      color: var(--rose);
      font-weight: 500;
      margin-left: auto;
      padding-left: 8px;
    }

    .item-actions {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .item-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      flex-shrink: 0;
    }

    .item-btn:active {
      background: rgba(232, 116, 138, 0.15);
      border-color: var(--rose);
      color: var(--rose);
    }

    .item-btn.save {
      border: 1px solid var(--rose);
      background: var(--rose-soft);
      color: var(--rose);
    }

    .edit-time-input {
      background: var(--surface2);
      border: 1px solid var(--rose);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Serif Display', serif;
      font-size: 17px;
      padding: 5px 9px;
      color-scheme: dark;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      outline: none;
    }

    .edit-oz-input {
      width: 50px;
      background: var(--surface2);
      border: 1px solid var(--rose);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 5px 8px;
      color-scheme: dark;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      text-align: center;
    }

    .edit-notes-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--rose);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 5px 9px;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      min-width: 0;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 40px 24px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 36px;
      opacity: 0.3;
      margin-bottom: 10px;
    }

    .empty-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted2);
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      justify-content: center;
      padding: 48px 0;
      gap: 6px;
    }

    .loading span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rose);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loading span:nth-child(2) { animation-delay: 0.15s; }
    .loading span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotBounce {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.75); }
      40%           { opacity: 1;   transform: scale(1); }
    }

    /* ── Feed tab ── */
    .feed-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }

    .feed-summary {
      text-align: center;
      margin-bottom: 20px;
    }

    .feed-total-oz {
      display: block;
      font-family: 'DM Serif Display', serif;
      font-size: 72px;
      line-height: 1;
      color: var(--text);
    }

    .feed-total-oz .unit {
      font-size: 22px;
      color: var(--muted2);
      margin-left: 2px;
    }

    .feed-total-label {
      display: block;
      font-size: 11px;
      color: var(--muted2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .type-toggles {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 14px;
    }

    .type-toggle {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
      font-family: 'DM Sans', sans-serif;
    }

    .type-toggle.active {
      background: var(--rose-soft);
      border-color: var(--rose);
    }

    .type-toggle .toggle-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 4px;
    }

    .type-toggle .toggle-label {
      font-size: 12px;
      color: var(--muted2);
      font-weight: 500;
    }

    .type-toggle.active .toggle-label {
      color: var(--rose);
    }

    .oz-stepper {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      width: 100%;
      margin-bottom: 14px;
    }

    .oz-stepper .stepper-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      position: absolute;
      top: -18px;
      left: 0;
    }

    .oz-stepper-wrap {
      position: relative;
      width: 100%;
      padding-top: 20px;
    }

    .step-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--rose-soft);
      border: 1px solid var(--border);
      color: var(--rose);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      flex-shrink: 0;
    }

    .step-btn:active {
      transform: scale(0.93);
    }

    .oz-display {
      flex: 1;
      text-align: center;
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      color: var(--text);
    }

    .oz-display .unit {
      font-size: 16px;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
    }

    .log-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--rose);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
    }

    .log-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .feed-list {
      flex: 1;
      padding: 4px 16px 24px;
    }

    /* ── Diaper tab ── */
    .diaper-section {
      display: flex;
      flex-direction: column;
      padding: 16px 16px 12px;
      flex-shrink: 0;
    }

    .countdown-card {
      background: linear-gradient(135deg, rgba(232,116,138,0.15), rgba(232,116,138,0.05));
      border: 1px solid rgba(232,116,138,0.22);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .countdown-label {
      font-size: 10px;
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .countdown-time {
      font-family: 'DM Serif Display', serif;
      font-size: 36px;
      color: var(--text);
      margin-top: 2px;
      letter-spacing: 2px;
    }

    .countdown-time.overdue {
      color: #e74c3c;
    }

    .countdown-right {
      text-align: right;
    }

    .countdown-last-label {
      font-size: 10px;
      color: var(--muted2);
    }

    .countdown-last-time {
      font-size: 15px;
      color: var(--text);
      font-family: 'DM Serif Display', serif;
      margin-top: 1px;
    }

    .progress-bar-wrap {
      height: 4px;
      background: rgba(232, 116, 138, 0.1);
      border-radius: 2px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--rose);
      border-radius: 2px;
      transition: width 1s linear;
    }

    .progress-bar.overdue {
      background: #e74c3c;
      width: 100% !important;
    }

    .diaper-form {
      padding: 0 8px;
    }

    .diaper-types {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .diaper-type-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      color: var(--muted2);
    }

    .diaper-type-btn.active {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: var(--rose);
    }

    .notes-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 11px 14px;
      margin-bottom: 12px;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .notes-input::placeholder {
      color: var(--muted);
    }

    .notes-input:focus {
      border-color: var(--rose);
    }

    .diaper-list {
      flex: 1;
      padding: 4px 16px 24px;
    }

    .item-notes {
      font-size: 11px;
      color: var(--muted);
      margin-left: 6px;
    }

    /* ── Trends tab ── */
    .trends-filter {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding: 12px 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 12px;
    }

    .filter-chips::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: var(--rose);
    }

    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 12px;
    }

    .date-range input[type="date"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 8px 10px;
      -webkit-appearance: none;
      appearance: none;
      color-scheme: dark;
      min-width: 0;
    }

    .date-range-sep {
      color: var(--muted);
      font-size: 14px;
      flex-shrink: 0;
    }

    .trends-content {
      padding: 16px;
    }

    .kpi-card {
      background: linear-gradient(135deg, rgba(232,116,138,0.10), rgba(232,116,138,0.03));
      border: 1px solid rgba(232,116,138,0.22);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .kpi-card-title {
      font-size: 10px;
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .kpi-item {
      background: rgba(20, 20, 20, 0.6);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .kpi-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .kpi-value {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--text);
      line-height: 1.2;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .chart-title {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 64px;
    }

    .bar-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
      align-self: flex-end;
    }

    .bar-formula {
      background: var(--rose);
      border-radius: 3px 3px 0 0;
      min-height: 0;
    }

    .bar-breast {
      background: var(--purple);
      border-radius: 0 0 3px 3px;
      min-height: 0;
    }

    .chart-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .chart-axis span {
      flex: 1;
      text-align: center;
      font-size: 9px;
      color: var(--muted);
    }

    .chart-legend {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .legend-text {
      font-size: 10px;
      color: var(--muted2);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 14px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .activity-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .activity-chip {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
    }

    .activity-chip.active {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: var(--rose);
    }

    /* Timeline */
    .timeline {
      border-left: 2px solid rgba(232, 116, 138, 0.2);
      margin-left: 12px;
      padding-left: 16px;
    }

    .timeline-day-header {
      position: relative;
      margin-bottom: 10px;
      margin-top: 16px;
    }

    .timeline-day-header:first-child {
      margin-top: 0;
    }

    .timeline-day-title {
      font-family: 'DM Serif Display', serif;
      font-size: 16px;
      color: var(--text);
    }

    .timeline-day-sub {
      font-size: 11px;
      color: var(--muted2);
      margin-top: 1px;
    }

    .timeline-entry {
      position: relative;
      margin-bottom: 12px;
    }

    .timeline-dot {
      position: absolute;
      left: -23px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .timeline-dot.feed { background: var(--rose); }
    .timeline-dot.diaper { background: var(--purple); }

    .timeline-time {
      font-size: 11px;
      color: var(--muted2);
      margin-bottom: 4px;
    }

    .timeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-card-text {
      font-size: 13px;
      color: var(--text);
    }

    .timeline-card-value {
      font-size: 14px;
      color: var(--rose);
      font-weight: 500;
    }

    .timeline-card-notes {
      font-size: 11px;
      color: var(--muted);
      margin-left: 8px;
    }

    /* ── Edit toggle styles for diaper type in edit mode ── */
    .edit-type-toggles {
      display: flex;
      gap: 4px;
    }

    .edit-type-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .edit-type-btn.active {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: var(--rose);
    }

    /* ── Meds tab ── */
    .meds-due { padding: 16px 16px 4px; }

    .meds-card {
      background: linear-gradient(135deg, rgba(232,116,138,0.15), rgba(232,116,138,0.05));
      border: 1px solid rgba(232,116,138,0.22);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 8px;
    }

    .meds-card.overdue-card {
      border-color: rgba(231,76,60,0.4);

<script>
  // ── Config ──
  const SUPABASE_URL     = 'https://elmewigpebwwswjdeits.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsbWV3aWdwZWJ3d3N3amRlaXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MjY3ODcsImV4cCI6MjA4ODUwMjc4N30.wLo7V4cmuJwng4xWbZvzhCgLVhO860oSnIl9yt_EB1w';
  const DIAPER_INTERVAL_MS = 4 * 60 * 60 * 1000;

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function getSessionKey() { return 'helena-amaya'; }

  // ── State ──
  let todayFeedings = [];
  let todayDiapers  = [];
  let feedOz        = 4;
  let feedType      = 'formula';
  let diaperType    = 'wet';
  let isAdding      = false;
  let editingFeedId   = null;
  let editingDiaperId = null;
  let lastChangedAt   = null;
  let countdownInterval = null;
  let trendsFilter  = { mode: 'all', from: null, to: null };
  let activityFilter = 'all';
  let medications     = [];
  let medDoses        = [];
  let medsInterval    = null;
  let editingMedDoseId = null;
  let medFormState    = null;

  // ── Formatting helpers ──
  function formatTime(dateStr) {
    return new Date(dateStr).toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', hour12: true
    });
  }

  function getLocalTimeValue(dateStr) {
    const d = new Date(dateStr);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function buildNewTimestamp(originalDateStr, newTimeValue) {
    const d = new Date(originalDateStr);
    const [h, m] = newTimeValue.split(':').map(Number);
    d.setHours(h, m, 0, 0);
    return d.toISOString();
  }

  function formatDateParts(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return {
      dayName: d.toLocaleDateString('en-US', { weekday: 'long' }),
      full: d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
      short: d.toLocaleDateString('en-US', { weekday: 'short' }),
    };
  }

  // Day-bucket key in LOCAL time. Timestamps come back from Supabase as UTC
  // ISO strings, so slicing "YYYY-MM-DD" off them would group by the UTC date —
  // shifting evening/early-morning entries onto the wrong day in the Trends
  // timeline, charts and per-day stats. Derive the key from the local date.
  function localDayKey(dateStr) {
    const d = new Date(dateStr);
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  // ── Meds scheduling (pure) ──
  function medEndAt(med) {
    if (med.duration_type !== 'days') return null;
    return new Date(new Date(med.start_at).getTime() + med.duration_days * 86400000);
  }
  function isMedFinished(med, nowMs) {
    const end = medEndAt(med);
    return !!end && nowMs > end.getTime();
  }
  function isMedActive(med, nowMs) {
    return med.status === 'active' && !isMedFinished(med, nowMs);
  }
  function medDueSlots(med, nowMs) {
    const startMs = new Date(med.start_at).getTime();
    const end = medEndAt(med);
    const endMs = end ? end.getTime() : Infinity;
    let due = null, next = null;
    if (med.schedule_type === 'interval') {
      const step = med.interval_hours * 3600000;
      if (nowMs >= startMs) {
        const k = Math.floor((nowMs - startMs) / step);
        const d = startMs + k * step;
        if (d <= endMs) due = d;
      }
      const nk = nowMs < startMs ? 0 : Math.floor((nowMs - startMs) / step) + 1;
      const n = startMs + nk * step;
      if (n <= endMs && n > nowMs) next = n;
    } else {
      const times = med.fixed_times || [];
      const base = new Date(nowMs);
      for (let off = -1; off <= 1; off++) {
        const day = new Date(base.getFullYear(), base.getMonth(), base.getDate() + off);
        for (const t of times) {
          const [h, m] = t.split(':').map(Number);
          const slot = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, m, 0, 0).getTime();
          if (slot < startMs || slot > endMs) continue;
          if (slot <= nowMs && (due === null || slot > due)) due = slot;
          if (slot > nowMs && (next === null || slot < next)) next = slot;
        }
      }
    }
    return { dueSlot: due, nextSlot: next };
  }
  function slotActioned(slotMs, doses) {
    return doses.some(d => d.scheduled_for && new Date(d.scheduled_for).getTime() === slotMs);
  }
  function doseStatus(med, doses, nowMs) {
    const { dueSlot, nextSlot } = medDueSlots(med, nowMs);
    if (dueSlot !== null && !slotActioned(dueSlot, doses))
      return { state: 'overdue', slotMs: dueSlot, deltaMs: nowMs - dueSlot };
    if (nextSlot !== null)
      return { state: 'upcoming', slotMs: nextSlot, deltaMs: nextSlot - nowMs };
    return { state: 'none', slotMs: null, deltaMs: 0 };
  }
  function scheduleSummary(med, nowMs) {
    let s;
    if (med.schedule_type === 'interval') {
      const h = med.interval_hours;
      s = 'every ' + (h % 1 === 0 ? h : h.toFixed(1)) + 'h';
    } else {
      s = (med.fixed_times || []).map(t => {
        const [hh, mm] = t.split(':').map(Number);
        const ap = hh < 12 ? 'AM' : 'PM';
        const h12 = hh % 12 === 0 ? 12 : hh % 12;
        return h12 + ':' + String(mm).padStart(2, '0') + ' ' + ap;
      }).join(', ');
    }
    if (med.status === 'stopped') return s + ' · stopped';
    if (isMedFinished(med, nowMs)) return s + ' · finished';
    if (med.duration_type === 'ongoing') return s + ' · ongoing';
    const end = medEndAt(med);
    const daysLeft = Math.max(0, Math.ceil((end.getTime() - nowMs) / 86400000));
    return s + ' · ' + daysLeft + ' day' + (daysLeft !== 1 ? 's' : '') + ' left';
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function feedTypeLabel(type) {
    return type === 'formula' ? '🍼 Formula' : '🤱 Breast';
  }

  function diaperTypeLabel(type) {
    if (type === 'wet') return '💧 Wet';
    if (type === 'dirty') return '💩 Dirty';
    return '💧💩 Both';
  }

  // ── Tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.tab-panel[data-tab="${btn.dataset.tab}"]`).classList.add('active');
      if (btn.dataset.tab === 'trends') fetchTrends();
      if (btn.dataset.tab === 'meds') fetchMeds();
    });
  });

  // ══════════════════════════════════
  // FEED TAB
  // ══════════════════════════════════

  // ── Feed type toggle ──
  document.getElementById('feedTypeToggles').addEventListener('click', e => {
    const btn = e.target.closest('.type-toggle');
    if (!btn) return;
    document.querySelectorAll('#feedTypeToggles .type-toggle').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    feedType = btn.dataset.type;
  });

  // ── Oz stepper ──
  function updateOzDisplay() {
    document.getElementById('ozDisplay').innerHTML = `${feedOz} <span class="unit">oz</span>`;
  }

  document.getElementById('ozMinus').addEventListener('click', () => {
    if (feedOz > 0.5) { feedOz = Math.round((feedOz - 0.5) * 10) / 10; updateOzDisplay(); }
  });

  document.getElementById('ozPlus').addEventListener('click', () => {
    if (feedOz < 20) { feedOz = Math.round((feedOz + 0.5) * 10) / 10; updateOzDisplay(); }
  });

  // ── Supabase: Add feeding ──
  async function addFeeding() {
    if (isAdding) return;
    isAdding = true;

    const { data, error } = await client
      .from('feedings')
      .insert({ amount_oz: feedOz, feed_type: feedType, session_key: getSessionKey() })
      .select()
      .single();

    if (!error && data) {
      todayFeedings.unshift(data);
      renderFeedTab();
    }
    isAdding = false;
  }

  document.getElementById('logFeedBtn').addEventListener('click', addFeeding);

  // ── Supabase: Delete feeding ──
  async function deleteFeeding(id) {
    const { error } = await client.from('feedings').delete().eq('id', id);
    if (!error) {
      todayFeedings = todayFeedings.filter(f => f.id !== id);
      if (editingFeedId === id) editingFeedId = null;
      renderFeedTab();
    }
  }

  // ── Supabase: Edit feeding ──
  function editFeeding(id) {
    editingFeedId = id;
    renderFeedTab();
    requestAnimationFrame(() => {
      const input = document.getElementById(`edit-feed-time-${id}`);
      if (input) input.focus();
    });
  }

  function cancelFeedEdit() {
    editingFeedId = null;
    renderFeedTab();
  }

  async function saveFeeding(id) {
    const timeInput = document.getElementById(`edit-feed-time-${id}`);
    const ozInput = document.getElementById(`edit-feed-oz-${id}`);
    if (!timeInput || !ozInput) return;

    const feed = todayFeedings.find(f => f.id === id);
    if (!feed) return;

    const newTs = buildNewTimestamp(feed.fed_at, timeInput.value);
    const newOz = parseFloat(ozInput.value);
    if (isNaN(newOz) || newOz < 0.5 || newOz > 20) return;

    const activeType = document.querySelector(`#edit-feed-types-${id} .edit-type-btn.active`);
    const newType = activeType ? activeType.dataset.type : feed.feed_type;

    const { error } = await client
      .from('feedings')
      .update({ fed_at: newTs, amount_oz: newOz, feed_type: newType })
      .eq('id', id);

    if (!error) {
      feed.fed_at = newTs;
      feed.amount_oz = newOz;
      feed.feed_type = newType;
      todayFeedings.sort((a, b) => new Date(b.fed_at) - new Date(a.fed_at));
      editingFeedId = null;
      renderFeedTab();
    }
  }

  // ── Fetch today's feedings ──
  async function fetchTodayFeedings() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);

    const { data } = await client
      .from('feedings')
      .select('*')
      .eq('session_key', getSessionKey())
      .gte('fed_at', start.toISOString())
      .order('fed_at', { ascending: false });

    todayFeedings = data || [];
    renderFeedTab();
  }

  // ── Render feed tab ──
  function renderFeedTab() {
    const totalOz = todayFeedings.reduce((sum, f) => sum + parseFloat(f.amount_oz), 0);
    const count = todayFeedings.length;

    document.getElementById('feedTotalOz').innerHTML =
      `${totalOz % 1 === 0 ? totalOz : totalOz.toFixed(1)}<span class="unit">oz</span>`;
    document.getElementById('feedTotalLabel').textContent =
      count === 0 ? "Helena's feedings today" : `across ${count} feeding${count !== 1 ? 's' : ''}`;

    const list = document.getElementById('feedList');

    if (count === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🍼</div>
          <div class="empty-text">Helena hasn't been fed yet today.<br>Log her first feeding above.</div>
        </div>`;
      return;
    }

    const items = todayFeedings.map(f => {
      if (f.id === editingFeedId) {
        return `
        <div class="list-item" data-id="${f.id}">
          <input type="time" class="edit-time-input" id="edit-feed-time-${f.id}" value="${getLocalTimeValue(f.fed_at)}"
            onkeydown="if(event.key==='Enter')saveFeeding(${f.id});if(event.key==='Escape')cancelFeedEdit()">
          <div id="edit-feed-types-${f.id}" class="edit-type-toggles" style="margin-left:6px;">
            <button class="edit-type-btn ${f.feed_type === 'formula' ? 'active' : ''}" data-type="formula"
              onclick="this.parentElement.querySelectorAll('.edit-type-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">🍼</button>
            <button class="edit-type-btn ${f.feed_type === 'breast_milk' ? 'active' : ''}" data-type="breast_milk"
              onclick="this.parentElement.querySelectorAll('.edit-type-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">🤱</button>
          </div>

  // ── Countdown logic ──
  function updateCountdown() {
    const timeEl     = document.getElementById('countdownTime');
    const labelEl    = document.getElementById('countdownLabel');
    const lastTimeEl = document.getElementById('countdownLastTime');
    const barEl      = document.getElementById('progressBar');

    if (!lastChangedAt) {
      labelEl.textContent = 'No changes yet';
      timeEl.textContent = '—:——';
      timeEl.classList.remove('overdue');
      lastTimeEl.textContent = '—';
      barEl.style.width = '100%';
      barEl.classList.remove('overdue');
      return;
    }

    lastTimeEl.textContent = formatTime(lastChangedAt);
    const elapsed   = Date.now() - new Date(lastChangedAt).getTime();
    const remaining = DIAPER_INTERVAL_MS - elapsed;

    if (remaining <= 0) {
      const overMs  = Math.abs(remaining);
      const overMin = Math.floor(overMs / 60000);
      const overH   = Math.floor(overMin / 60);
      const overM   = overMin % 60;
      labelEl.textContent = 'OVERDUE';
      timeEl.textContent  = `${overH}:${String(overM).padStart(2, '0')}`;
      timeEl.classList.add('overdue');
      barEl.classList.add('overdue');
    } else {
      const remMin = Math.floor(remaining / 60000);
      const remH   = Math.floor(remMin / 60);
      const remM   = remMin % 60;
      labelEl.textContent = 'Next change in';
      timeEl.textContent  = `${remH}:${String(remM).padStart(2, '0')}`;
      timeEl.classList.remove('overdue');
      barEl.classList.remove('overdue');
      barEl.style.width = `${(remaining / DIAPER_INTERVAL_MS) * 100}%`;
    }
  }

  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);
  }

  // ── Supabase: Fetch latest diaper change (any time, not just today) ──
  async function fetchLastDiaperChange() {
    const { data } = await client
      .from('diaper_changes')
      .select('changed_at')
      .eq('session_key', getSessionKey())
      .order('changed_at', { ascending: false })
      .limit(1);

    lastChangedAt = (data && data.length > 0) ? data[0].changed_at : null;
    startCountdown();
  }

  // ── Supabase: Fetch today's diaper changes ──
  async function fetchTodayDiapers() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);

    const { data } = await client
      .from('diaper_changes')
      .select('*')
      .eq('session_key', getSessionKey())
      .gte('changed_at', start.toISOString())
      .order('changed_at', { ascending: false });

    todayDiapers = data || [];
    renderDiaperTab();
  }

  // ── Supabase: Add diaper change ──
  async function addDiaperChange() {
    if (isAdding) return;
    isAdding = true;

    const notes = document.getElementById('diaperNotes').value.trim() || null;

    const { data, error } = await client
      .from('diaper_changes')
      .insert({ diaper_type: diaperType, notes: notes, session_key: getSessionKey() })
      .select()
      .single();

    if (!error && data) {
      todayDiapers.unshift(data);
      lastChangedAt = data.changed_at;
      startCountdown();
      document.getElementById('diaperNotes').value = '';
      renderDiaperTab();
    }
    isAdding = false;
  }

  document.getElementById('logDiaperBtn').addEventListener('click', addDiaperChange);

  // ── Supabase: Delete diaper change ──
  async function deleteDiaper(id) {
    const { error } = await client.from('diaper_changes').delete().eq('id', id);
    if (!error) {
      todayDiapers = todayDiapers.filter(d => d.id !== id);
      if (editingDiaperId === id) editingDiaperId = null;
      renderDiaperTab();
      fetchLastDiaperChange();

  function editDiaper(id) {
    editingDiaperId = id;
    renderDiaperTab();
    requestAnimationFrame(() => {
      const input = document.getElementById(`edit-diaper-time-${id}`);

  async function saveDiaper(id) {
    const timeInput  = document.getElementById(`edit-diaper-time-${id}`);
    const notesInput = document.getElementById(`edit-diaper-notes-${id}`);
    if (!timeInput) return;

    const diaper = todayDiapers.find(d => d.id === id);
    if (!diaper) return;

    const newTs = buildNewTimestamp(diaper.changed_at, timeInput.value);
    const newNotes = notesInput ? (notesInput.value.trim() || null) : diaper.notes;

    const activeType = document.querySelector(`#edit-diaper-types-${id} .edit-type-btn.active`);
    const newType = activeType ? activeType.dataset.type : diaper.diaper_type;

    const { error } = await client
      .from('diaper_changes')
      .update({ changed_at: newTs, diaper_type: newType, notes: newNotes })
      .eq('id', id);

    if (!error) {
      diaper.changed_at = newTs;
      diaper.diaper_type = newType;
      diaper.notes = newNotes;
      todayDiapers.sort((a, b) => new Date(b.changed_at) - new Date(a.changed_at));
      editingDiaperId = null;
      renderDiaperTab();
      fetchLastDiaperChange();
    }
  }

  async function fetchMeds() {
    const [medsRes, dosesRes] = await Promise.all([
      client.from('medications').select('*').eq('session_key', getSessionKey())
        .order('created_at', { ascending: false }),
      client.from('med_doses').select('*').eq('session_key', getSessionKey())
        .order('given_at', { ascending: false, nullsFirst: false }),
    ]);
    medications = medsRes.data || [];
    medDoses = dosesRes.data || [];
    renderMedsTab();
    startMedsCountdown();
  }

  function dosesForMed(medId) {
    return medDoses.filter(d => d.medication_id === medId);
  }

  function renderMedsTab() {
    renderMedsDue();
    renderMedsTodayList();
    renderMedsLists();
  }

  function startMedsCountdown() {
    if (medsInterval) clearInterval(medsInterval);
    renderMedsDue();
    medsInterval = setInterval(renderMedsDue, 1000);
  }

  function fmtHM(ms) {
    const totalMin = Math.floor(Math.abs(ms) / 60000);
    return Math.floor(totalMin / 60) + ':' + String(totalMin % 60).padStart(2, '0');
  }

  function renderMedsDue() {
    const el = document.getElementById('medsDue');
    if (!el) return;
    const now = Date.now();
    const active = medications.filter(m => isMedActive(m, now));

    if (active.length === 0) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">💊</div>
          <div class="empty-text">No active medicines.<br>Add one below to start tracking doses.</div>
        </div>`;
      return;
    }

    el.innerHTML = active.map(med => {
      const st = doseStatus(med, dosesForMed(med.id), now);
      const dose = `${med.dose_amount} ${esc(med.dose_unit)}`;

      if (st.state === 'none') {
        return `
        <div class="meds-card">
          <div class="meds-card-top">
            <div>
              <div class="meds-card-name">${esc(med.name)}</div>
              <div class="meds-card-dose">${dose}</div>
            </div>
            <div class="meds-card-right"><div class="meds-card-sub">No upcoming dose</div></div>
          </div>
        </div>`;
      }

      const overdue = st.state === 'overdue';
      const label = overdue ? 'Overdue by' : 'Next dose in';
      const slotTime = formatTime(new Date(st.slotMs).toISOString());
      return `
        <div class="meds-card ${overdue ? 'overdue-card' : ''}">
          <div class="meds-card-top">
            <div>
              <div class="meds-card-name">${esc(med.name)}</div>
              <div class="meds-card-dose">${dose}</div>
            </div>
            <div class="meds-card-right">
              <div class="meds-card-sub">${label}</div>
              <div class="meds-card-count ${overdue ? 'overdue' : ''}">${fmtHM(st.deltaMs)}</div>
              <div class="meds-card-sub">${overdue ? 'due ' : 'at '}${slotTime}</div>
            </div>
          </div>
          ${overdue ? `
          <div class="meds-card-actions">
            <button class="log-btn" onclick="markDoseGiven(${med.id})">✓ Mark given</button>
            <button class="log-btn btn-secondary" onclick="skipDose(${med.id})">Skip</button>
          </div>` : ''}
        </div>`;
    }).join('');
  }

  async function markDoseGiven(medId) {
    const med = medications.find(m => m.id === medId);
    if (!med) return;
    const { dueSlot } = medDueSlots(med, Date.now());
    const { data, error } = await client.from('med_doses').insert({
      medication_id: medId, session_key: getSessionKey(),
      scheduled_for: dueSlot ? new Date(dueSlot).toISOString() : null,
      given_at: new Date().toISOString(),
      dose_amount: med.dose_amount, dose_unit: med.dose_unit, status: 'given',
    }).select().single();
    if (!error && data) { medDoses.unshift(data); renderMedsTab(); }
  }

  async function skipDose(medId) {
    const med = medications.find(m => m.id === medId);
    if (!med) return;
    const { dueSlot } = medDueSlots(med, Date.now());
    if (dueSlot === null) return;
    const { data, error } = await client.from('med_doses').insert({
      medication_id: medId, session_key: getSessionKey(),
      scheduled_for: new Date(dueSlot).toISOString(), given_at: null, status: 'skipped',
    }).select().single();
    if (!error && data) { medDoses.unshift(data); renderMedsTab(); }
  }

  async function logExtraDose(medId) {
    const med = medications.find(m => m.id === medId);
    if (!med) return;
    const { data, error } = await client.from('med_doses').insert({
      medication_id: medId, session_key: getSessionKey(),
      scheduled_for: null, given_at: new Date().toISOString(),
      dose_amount: med.dose_amount, dose_unit: med.dose_unit, status: 'given',
    }).select().single();
    if (!error && data) { medDoses.unshift(data); renderMedsTab(); }
  }

  function medName(id) {
    const m = medications.find(x => x.id === id);
    return m ? m.name : 'Medicine';
  }

  function renderMedsTodayList() {
    const el = document.getElementById('medsTodayList');
    if (!el) return;
    const today = localDayKey(new Date().toISOString());
    const todays = medDoses
      .filter(d => { const ref = d.given_at || d.scheduled_for; return ref && localDayKey(ref) === today; })
      .sort((a, b) => new Date(b.given_at || b.scheduled_for) - new Date(a.given_at || a.scheduled_for));

    if (todays.length === 0) { el.innerHTML = ''; return; }

    const units = ['mL', 'mg', 'drops', 'IU', 'tsp', 'tablet'];
    const items = todays.map(d => {
      if (d.id === editingMedDoseId && d.status === 'given') {
        return `
        <div class="list-item" data-id="${d.id}">
          <input type="time" class="edit-time-input" id="edit-meddose-time-${d.id}" value="${getLocalTimeValue(d.given_at)}"
            onkeydown="if(event.key==='Enter')saveMedDose(${d.id});if(event.key==='Escape')cancelMedDoseEdit()">
          <input type="number" class="edit-oz-input" id="edit-meddose-amt-${d.id}" value="${d.dose_amount}" step="0.5" min="0" style="margin-left:6px;">
          <select class="med-select" id="edit-meddose-unit-${d.id}" style="margin-left:6px;width:auto;flex:0 0 80px;padding:6px 8px;font-size:13px;">
            ${units.map(u => `<option value="${u}" ${d.dose_unit === u ? 'selected' : ''}>${u}</option>`).join('')}
          </select>
          <div class="item-actions" style="margin-left:6px;">
            <button class="item-btn save" onclick="saveMedDose(${d.id})" aria-label="Save">✓</button>
            <button class="item-btn" onclick="cancelMedDoseEdit()" aria-label="Cancel">×</button>
          </div>
        </div>`;
      }
      const skipped = d.status === 'skipped';
      const time = skipped ? (d.scheduled_for ? formatTime(d.scheduled_for) : '—') : formatTime(d.given_at);
      return `
      <div class="list-item ${skipped ? 'med-item-skipped' : ''}" data-id="${d.id}">
        <div class="item-time">${time}</div>
        <div class="item-detail">${esc(medName(d.medication_id))}</div>
        ${skipped
          ? `<div class="item-value med-tag-skipped">skipped</div>`
          : `<div class="item-value">${d.dose_amount} ${esc(d.dose_unit)}</div>`}
        <div class="item-actions">
          ${skipped ? '' : `<button class="item-btn" onclick="editMedDose(${d.id})" aria-label="Edit">✎</button>`}
          <button class="item-btn" onclick="deleteMedDose(${d.id})" aria-label="Delete">×</button>
        </div>
      </div>`;
    }).join('');

    el.innerHTML = `<div class="section-label">Helena's meds today ♡</div>` + items;
  }

  function editMedDose(id) {
    editingMedDoseId = id;
    renderMedsTodayList();
    requestAnimationFrame(() => {
      const input = document.getElementById(`edit-meddose-time-${id}`);
      if (input) input.focus();
    });
  }

  function cancelMedDoseEdit() {
    editingMedDoseId = null;
    renderMedsTodayList();
  }

  async function saveMedDose(id) {
    const timeInput = document.getElementById(`edit-meddose-time-${id}`);
    const amtInput = document.getElementById(`edit-meddose-amt-${id}`);
    const unitInput = document.getElementById(`edit-meddose-unit-${id}`);
    if (!timeInput || !amtInput) return;
    const dose = medDoses.find(d => d.id === id);
    if (!dose || !dose.given_at) return;
    const newTs = buildNewTimestamp(dose.given_at, timeInput.value);
    const newAmt = parseFloat(amtInput.value);
    if (isNaN(newAmt) || newAmt <= 0) return;
    const newUnit = unitInput ? unitInput.value : dose.dose_unit;
    const { error } = await client.from('med_doses')
      .update({ given_at: newTs, dose_amount: newAmt, dose_unit: newUnit })
      .eq('id', id);
    if (!error) {
      dose.given_at = newTs; dose.dose_amount = newAmt; dose.dose_unit = newUnit;
      editingMedDoseId = null;
      renderMedsTab();
    }
  }

  async function deleteMedDose(id) {
    const { error } = await client.from('med_doses').delete().eq('id', id);
    if (!error) {
      medDoses = medDoses.filter(d => d.id !== id);
      if (editingMedDoseId === id) editingMedDoseId = null;
      renderMedsTab();
    }
  }

  function renderMedsLists() {
    const activeEl = document.getElementById('medsActiveList');
    const finishedEl = document.getElementById('medsFinishedList');
    if (!activeEl || !finishedEl) return;
    const now = Date.now();
    const active = medications.filter(m => isMedActive(m, now));
    const inactive = medications.filter(m => !isMedActive(m, now));

    const medRow = (med, actions) => `
      <div class="list-item" data-id="${med.id}">
        <div style="flex:1;min-width:0;">
          <div class="meds-card-name">${esc(med.name)}
            <span style="color:var(--rose);font-size:13px;font-weight:500;">${med.dose_amount} ${esc(med.dose_unit)}</span>
          </div>
          <div class="med-summary">${esc(scheduleSummary(med, now))}</div>
        </div>
        <div class="item-actions">${actions}</div>
      </div>`;

    activeEl.innerHTML = active.length === 0 ? '' :
      `<div class="section-label">Active medicines</div>` +
      active.map(med => medRow(med, `
        <button class="item-btn" onclick="logExtraDose(${med.id})" aria-label="Log an extra dose">+</button>
        <button class="item-btn" onclick="editMed(${med.id})" aria-label="Edit">✎</button>
        <button class="item-btn" onclick="stopMed(${med.id})" aria-label="Stop">⏹</button>
        <button class="item-btn" onclick="deleteMed(${med.id})" aria-label="Delete">×</button>
      `)).join('');

    finishedEl.innerHTML = inactive.length === 0 ? '' :
      `<div class="section-label med-finished-section">Finished / stopped</div>` +
      inactive.map(med => medRow(med, `
        <button class="item-btn" onclick="deleteMed(${med.id})" aria-label="Delete">×</button>
      `)).join('');
  }

  async function stopMed(id) {
    const { error } = await client.from('medications').update({ status: 'stopped' }).eq('id', id);
    if (!error) {
      const m = medications.find(x => x.id === id);
      if (m) m.status = 'stopped';
      renderMedsTab();
      startMedsCountdown();
    }
  }

  async function deleteMed(id) {
    if (!confirm('Delete this medicine and all its logged doses?')) return;
    const { error } = await client.from('medications').delete().eq('id', id);
    if (!error) {
      medications = medications.filter(m => m.id !== id);
      medDoses = medDoses.filter(d => d.medication_id !== id);
      renderMedsTab();
      startMedsCountdown();
    }
  }

  // ── Add / edit medicine form ──
  const MED_UNITS = ['mL', 'mg', 'drops', 'IU', 'tsp', 'tablet'];

  function blankMedForm() {
    const nowIso = new Date().toISOString();
    return {
      id: null, name: '', dose_amount: '', dose_unit: 'mL',
      schedule_type: 'interval', interval_hours: '8', fixed_times: ['08:00'],
      start_date: localDayKey(nowIso), start_time: getLocalTimeValue(nowIso),
      duration_type: 'days', duration_days: '5',
    };
  }

  function openMedForm(med) {
    if (med) {
      const times = Array.isArray(med.fixed_times) ? med.fixed_times.slice() : [];
      medFormState = {
        id: med.id, name: med.name,
        dose_amount: String(med.dose_amount), dose_unit: med.dose_unit,
        schedule_type: med.schedule_type,
        interval_hours: med.interval_hours != null ? String(med.interval_hours) : '8',
        fixed_times: times.length ? times : ['08:00'],
        start_date: localDayKey(med.start_at), start_time: getLocalTimeValue(med.start_at),
        duration_type: med.duration_type,
        duration_days: med.duration_days != null ? String(med.duration_days) : '5',
      };
    } else {
      medFormState = blankMedForm();
    }
    document.getElementById('medsForm').style.display = 'block';
    renderMedForm();
    requestAnimationFrame(() => { const n = document.getElementById('mf-name'); if (n) n.focus(); });
  }

  function closeMedForm() {
    medFormState = null;
    const form = document.getElementById('medsForm');
    if (form) { form.style.display = 'none'; form.innerHTML = ''; }
  }

  function syncMedFormState() {
    const f = medFormState; if (!f) return;
    const g = id => document.getElementById(id);
    if (g('mf-name')) f.name = g('mf-name').value;
    if (g('mf-dose')) f.dose_amount = g('mf-dose').value;
    if (g('mf-unit')) f.dose_unit = g('mf-unit').value;
    if (g('mf-interval')) f.interval_hours = g('mf-interval').value;
    if (g('mf-start-date')) f.start_date = g('mf-start-date').value;
    if (g('mf-start-time')) f.start_time = g('mf-start-time').value;
    if (g('mf-days')) f.duration_days = g('mf-days').value;
    const timeInputs = document.querySelectorAll('.mf-time');
    if (timeInputs.length) f.fixed_times = Array.from(timeInputs).map(i => i.value);
  }

  function setMedSchedule(type) { syncMedFormState(); medFormState.schedule_type = type; renderMedForm(); }
  function setMedDuration(type) { syncMedFormState(); medFormState.duration_type = type; renderMedForm(); }
  function addMedTime() { syncMedFormState(); medFormState.fixed_times.push('08:00'); renderMedForm(); }
  function removeMedTime(i) {
    syncMedFormState();
    medFormState.fixed_times.splice(i, 1);
    if (!medFormState.fixed_times.length) medFormState.fixed_times.push('08:00');
    renderMedForm();
  }

  function renderMedForm() {
    const f = medFormState; if (!f) return;
    const form = document.getElementById('medsForm');
    const seg = (active, type, fn, label) =>
      `<button type="button" class="med-seg-btn ${active ? 'active' : ''}" onclick="${fn}('${type}')">${label}</button>`;

    const scheduleFields = f.schedule_type === 'interval'
      ? `<div class="med-form-row">
           <label class="med-form-label">Every (hours)</label>
           <input type="number" class="med-input" id="mf-interval" value="${esc(f.interval_hours)}" step="0.5" min="0.5">
         </div>`
      : `<div class="med-form-row">
           <label class="med-form-label">Times of day</label>
           ${f.fixed_times.map((t, i) => `
             <div class="med-time-row">
               <input type="time" class="med-input mf-time" value="${t}">
               <button type="button" class="med-time-del" onclick="removeMedTime(${i})" aria-label="Remove time">×</button>
             </div>`).join('')}
           <button type="button" class="med-time-add" onclick="addMedTime()">+ add time</button>
         </div>`;

    const durationFields = f.duration_type === 'days'
      ? `<div class="med-form-row">
           <label class="med-form-label">For how many days</label>
           <input type="number" class="med-input" id="mf-days" value="${esc(f.duration_days)}" step="1" min="1">
         </div>` : '';

    form.innerHTML = `
      <div class="med-form-row">
        <label class="med-form-label">Medicine name</label>
        <input type="text" class="med-input" id="mf-name" value="${esc(f.name)}" placeholder="e.g. Paracetamol" maxlength="80">
      </div>
      <div class="med-form-row">
        <label class="med-form-label">Dose</label>
        <div class="med-row-2">
          <input type="number" class="med-input" id="mf-dose" value="${esc(f.dose_amount)}" step="0.5" min="0" placeholder="2.5" style="flex:1;">
          <select class="med-select" id="mf-unit" style="flex:0 0 110px;">
            ${MED_UNITS.map(u => `<option value="${u}" ${f.dose_unit === u ? 'selected' : ''}>${u}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="med-form-row">
        <label class="med-form-label">Schedule</label>
        <div class="med-seg">
          ${seg(f.schedule_type === 'interval', 'interval', 'setMedSchedule', 'Every N hours')}
          ${seg(f.schedule_type === 'fixed', 'fixed', 'setMedSchedule', 'Fixed times')}
        </div>
      </div>
      ${scheduleFields}
      <div class="med-form-row">
        <label class="med-form-label">Start</label>
        <div class="med-row-2">
          <input type="date" class="med-input" id="mf-start-date" value="${f.start_date}" style="flex:1;">
          <input type="time" class="med-input" id="mf-start-time" value="${f.start_time}" style="flex:0 0 120px;">
        </div>
      </div>
      <div class="med-form-row">
        <label class="med-form-label">Duration</label>
        <div class="med-seg">
          ${seg(f.duration_type === 'days', 'days', 'setMedDuration', 'For N days')}
          ${seg(f.duration_type === 'ongoing', 'ongoing', 'setMedDuration', 'Ongoing')}
        </div>
      </div>
      ${durationFields}
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="log-btn" onclick="submitMedForm()">${f.id ? 'Save changes' : 'Add medicine'}</button>
        <button class="log-btn btn-secondary" onclick="closeMedForm()">Cancel</button>
      </div>`;
  }

  async function submitMedForm() {
    syncMedFormState();
    const f = medFormState; if (!f) return;
    const name = f.name.trim();
    const doseAmount = parseFloat(f.dose_amount);
    if (!name || isNaN(doseAmount) || doseAmount <= 0) return;

    let interval_hours = null, fixed_times = null;
    if (f.schedule_type === 'interval') {
      interval_hours = parseFloat(f.interval_hours);
      if (isNaN(interval_hours) || interval_hours <= 0) return;
    } else {
      fixed_times = (f.fixed_times || []).filter(t => /^\d{2}:\d{2}$/.test(t));
      if (!fixed_times.length) return;
    }
    let duration_days = null;
    if (f.duration_type === 'days') {
      duration_days = parseInt(f.duration_days, 10);
      if (isNaN(duration_days) || duration_days < 1) return;
    }
    const startIso = new Date(`${f.start_date}T${f.start_time}`).toISOString();

    const row = {
      session_key: getSessionKey(), name,
      dose_amount: doseAmount, dose_unit: f.dose_unit,
      schedule_type: f.schedule_type, interval_hours, fixed_times,
      start_at: startIso, duration_type: f.duration_type, duration_days,
    };
    const { error } = f.id
      ? await client.from('medications').update(row).eq('id', f.id)
      : await client.from('medications').insert({ ...row, status: 'active' });
    if (!error) { closeMedForm(); await fetchMeds(); }
  }

  function editMed(id) {
    const med = medications.find(m => m.id === id);
    if (med) openMedForm(med);
  }

  document.getElementById('medsAddToggle').addEventListener('click', () => {
    const form = document.getElementById('medsForm');
    if (form.style.display === 'none' || !medFormState) openMedForm(null);
    else closeMedForm();
  });

  // ══════════════════════════════════
  // TRENDS TAB
  // ══════════════════════════════════

  // ── Filter chip handlers ──
  document.getElementById('trendsFilterChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#trendsFilterChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    trendsFilter.mode = chip.dataset.mode;
    const dateRange = document.getElementById('trendsDateRange');
    dateRange.style.display = trendsFilter.mode === 'custom' ? 'flex' : 'none';
    if (trendsFilter.mode !== 'custom') fetchTrends();
  });

  document.getElementById('trendsDateFrom').addEventListener('change', e => {
    trendsFilter.from = e.target.value;
    if (trendsFilter.from || trendsFilter.to) fetchTrends();
  });

  document.getElementById('trendsDateTo').addEventListener('change', e => {
    trendsFilter.to = e.target.value;
    if (trendsFilter.from || trendsFilter.to) fetchTrends();
  });

  // ── Compute filter date range ──
  function getTrendsFilterDates() {
    const now = new Date();
    switch (trendsFilter.mode) {
      case 'today': {
        const s = new Date(); s.setHours(0, 0, 0, 0);
        const e = new Date(); e.setHours(23, 59, 59, 999);
        return { from: s.toISOString(), to: e.toISOString() };
      }
      case 'week': {
        const s = new Date(); s.setDate(now.getDate() - 6); s.setHours(0, 0, 0, 0);
        return { from: s.toISOString(), to: null };
      }
      case 'month': {
        const s = new Date(); s.setDate(now.getDate() - 29); s.setHours(0, 0, 0, 0);
        return { from: s.toISOString(), to: null };
      }
      case 'custom': {
        const from = trendsFilter.from ? new Date(trendsFilter.from + 'T00:00:00').toISOString() : null;
        const to   = trendsFilter.to   ? new Date(trendsFilter.to   + 'T23:59:59').toISOString() : null;
        return { from, to };
      }
      default: return { from: null, to: null };
    }
  }

  // ── Fetch trends data ──
  async function fetchTrends() {
    const content = document.getElementById('trendsContent');
    content.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';

    const { from, to } = getTrendsFilterDates();

    let feedQuery = client.from('feedings').select('*').eq('session_key', getSessionKey()).order('fed_at', { ascending: true });
    let diaperQuery = client.from('diaper_changes').select('*').eq('session_key', getSessionKey()).order('changed_at', { ascending: true });
    let medQuery = client.from('med_doses').select('*, medications(name)').eq('session_key', getSessionKey()).eq('status', 'given').order('given_at', { ascending: true });

    if (from) {
      feedQuery = feedQuery.gte('fed_at', from);
      diaperQuery = diaperQuery.gte('changed_at', from);
      medQuery = medQuery.gte('given_at', from);
    }
    if (to) {
      feedQuery = feedQuery.lte('fed_at', to);
      diaperQuery = diaperQuery.lte('changed_at', to);
      medQuery = medQuery.lte('given_at', to);
    }

    const [feedResult, diaperResult, medResult] = await Promise.all([feedQuery, diaperQuery, medQuery]);
    const feeds   = feedResult.data  || [];
    const diapers = diaperResult.data || [];
    const meds    = medResult.data || [];

    renderTrends(feeds, diapers, meds);
  }

  // ── Activity filter handler (delegated, rendered dynamically) ──
  function setActivityFilter(filter) {
    activityFilter = filter;
    document.querySelectorAll('.activity-chip').forEach(c => c.classList.remove('active'));
    document.querySelector(`.activity-chip[data-filter="${filter}"]`).classList.add('active');
    const entries = document.querySelectorAll('.timeline-entry');
    entries.forEach(el => {
      if (filter === 'all') { el.style.display = ''; }
      else if (filter === 'feeds') { el.style.display = el.dataset.type === 'feed' ? '' : 'none'; }
      else if (filter === 'diapers') { el.style.display = el.dataset.type === 'diaper' ? '' : 'none'; }
      else { el.style.display = el.dataset.type === 'med' ? '' : 'none'; }
    });
  }

  // ── Group feeds by day ──
  function groupFeedsByDay(feeds) {
    return feeds.reduce((acc, f) => {
      const day = localDayKey(f.fed_at);
      (acc[day] = acc[day] || []).push(f);
      return acc;
    }, {});
  }

  // ── Render trends ──
  function renderTrends(feeds, diapers, meds) {
    meds = meds || [];
    const content = document.getElementById('trendsContent');

    if (feeds.length === 0 && diapers.length === 0 && meds.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <div class="empty-text">No data for this period yet.</div>
        </div>`;
      return;
    }

    // ── KPIs ──
    const feedDays = new Set(feeds.map(f => localDayKey(f.fed_at)));
    const diaperDays = new Set(diapers.map(d => localDayKey(d.changed_at)));
    const medDays = new Set(meds.map(m => localDayKey(m.given_at)));
    const allDays = new Set([...feedDays, ...diaperDays, ...medDays]);
    const numDays = Math.max(allDays.size, 1);

    const totalOz = feeds.reduce((s, f) => s + parseFloat(f.amount_oz), 0);
    const formulaOz = feeds.filter(f => f.feed_type === 'formula').reduce((s, f) => s + parseFloat(f.amount_oz), 0);
    const formulaPct = totalOz > 0 ? Math.round((formulaOz / totalOz) * 100) : 0;
    const avgOzDay = Math.round(totalOz / numDays * 10) / 10;
    const avgFeedsDay = Math.round(feeds.length / numDays * 10) / 10;
    const avgDiapersDay = Math.round(diapers.length / numDays * 10) / 10;
    const avgMedsDay = Math.round(meds.length / numDays * 10) / 10;

    let html = `
      <div class="kpi-card">
        <div class="kpi-card-title">Summary · ${numDays} day${numDays !== 1 ? 's' : ''} ♡</div>
        <div class="kpi-grid">
          <div class="kpi-item">
            <div class="kpi-label">Avg oz/day</div>
            <div class="kpi-value">${avgOzDay}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Feeds/day</div>
            <div class="kpi-value">${avgFeedsDay}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Diapers/day</div>
            <div class="kpi-value">${avgDiapersDay}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Meds/day</div>
            <div class="kpi-value">${avgMedsDay}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Formula %</div>
            <div class="kpi-value">${formulaPct}<span style="font-size:12px;color:var(--muted2);">%</span></div>
          </div>
        </div>
      </div>`;

    // ── Stacked bar chart (max 7 recent days) ──
    const feedsByDay = groupFeedsByDay(feeds);
    const sortedDays = [...allDays].sort();
    const chartDays = sortedDays.slice(-7);

    if (chartDays.length > 0) {
      let maxDayOz = 0;
      const dayData = chartDays.map(day => {
        const dayFeeds = feedsByDay[day] || [];
        const fOz = dayFeeds.filter(f => f.feed_type === 'formula').reduce((s, f) => s + parseFloat(f.amount_oz), 0);
        const bOz = dayFeeds.filter(f => f.feed_type === 'breast_milk').reduce((s, f) => s + parseFloat(f.amount_oz), 0);
        const total = fOz + bOz;
        if (total > maxDayOz) maxDayOz = total;
        return { day, fOz, bOz, total };
      });

      const maxBarH = 56;
      const bars = dayData.map(d => {
        const fH = maxDayOz > 0 ? Math.max(0, Math.round((d.fOz / maxDayOz) * maxBarH)) : 0;
        const bH = maxDayOz > 0 ? Math.max(0, Math.round((d.bOz / maxDayOz) * maxBarH)) : 0;
        return `<div class="bar-stack">
          <div class="bar-formula" style="height:${fH}px"></div>
          <div class="bar-breast" style="height:${bH}px"></div>
        </div>`;
      }).join('');

      const labels = dayData.map(d => {
        const { short } = formatDateParts(d.day);
        return `<span>${short}</span>`;
      }).join('');

      html += `
        <div class="chart-card">
          <div class="chart-title">Daily intake (oz)</div>
          <div class="bar-chart">${bars}</div>
          <div class="chart-axis">${labels}</div>
          <div class="chart-legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--rose)"></div><span class="legend-text">Formula</span></div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div><span class="legend-text">Breast milk</span></div>
          </div>
        </div>`;
    }

    // ── Divider ──
    html += `
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">Activity log</div>
        <div class="divider-line"></div>
      </div>`;

    // ── Activity type chips ──
    html += `
      <div class="activity-chips">
        <button class="activity-chip active" data-filter="all" onclick="setActivityFilter('all')">All</button>
        <button class="activity-chip" data-filter="feeds" onclick="setActivityFilter('feeds')">🍼 Feeds</button>
        <button class="activity-chip" data-filter="diapers" onclick="setActivityFilter('diapers')">🧷 Diapers</button>
        <button class="activity-chip" data-filter="meds" onclick="setActivityFilter('meds')">💊 Meds</button>
      </div>`;

    // ── Timeline ──
    const allEvents = [
      ...feeds.map(f => ({ type: 'feed', time: f.fed_at, data: f })),
      ...diapers.map(d => ({ type: 'diaper', time: d.changed_at, data: d })),
      ...meds.map(m => ({ type: 'med', time: m.given_at, data: m })),
    ].sort((a, b) => new Date(b.time) - new Date(a.time));

    const eventsByDay = {};
    allEvents.forEach(e => {
      const day = localDayKey(e.time);
      (eventsByDay[day] = eventsByDay[day] || []).push(e);
    });

    const eventDays = Object.keys(eventsByDay).sort((a, b) => b.localeCompare(a));

    html += '<div class="timeline">';

    eventDays.forEach(day => {
      const { dayName, full } = formatDateParts(day);
      html += `
        <div class="timeline-day-header">
          <div class="timeline-day-title">${dayName}</div>
          <div class="timeline-day-sub">${full}</div>
        </div>`;

      eventsByDay[day].forEach(e => {
        if (e.type === 'feed') {
          html += `
            <div class="timeline-entry" data-type="feed">
              <div class="timeline-dot feed"></div>
              <div class="timeline-time">${formatTime(e.time)}</div>
              <div class="timeline-card">
                <span class="timeline-card-text">${feedTypeLabel(e.data.feed_type)}</span>
                <span class="timeline-card-value">${e.data.amount_oz} oz</span>
              </div>
            </div>`;
        } else if (e.type === 'med') {
          html += `
            <div class="timeline-entry" data-type="med">
              <div class="timeline-dot med"></div>
              <div class="timeline-time">${formatTime(e.time)}</div>
              <div class="timeline-card">
                <span class="timeline-card-text">💊 ${esc(e.data.medications ? e.data.medications.name : 'Medicine')}</span>
                <span class="timeline-card-value">${e.data.dose_amount} ${esc(e.data.dose_unit)}</span>
              </div>
            </div>`;
        } else {
          html += `
            <div class="timeline-entry" data-type="diaper">
              <div class="timeline-dot diaper"></div>
              <div class="timeline-time">${formatTime(e.time)}</div>
              <div class="timeline-card">
                <span class="timeline-card-text">${diaperTypeLabel(e.data.diaper_type)}</span>
                ${e.data.notes ? `<span class="timeline-card-notes">${esc(e.data.notes)}</span>` : ''}
              </div>
            </div>`;
        }
      });
    });

    html += '</div>';
    content.innerHTML = html;
    activityFilter = 'all';
  }

  // ══════════════════════════════════
  // INIT
  // ══════════════════════════════════

  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  fetchTodayFeedings();
  fetchTodayDiapers();
  fetchLastDiaperChange();
  fetchMeds();
</script>

</body>
</html>
