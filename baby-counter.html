<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Helena Amaya ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f5f0ee;
      --muted: #5a5a5a;
      --muted2: #888;
      --rose: #e8748a;
      --rose-soft: rgba(232, 116, 138, 0.10);
      --rose-glow: rgba(232, 116, 138, 0.22);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ── */
    .header {
      flex-shrink: 0;
      padding: 54px 24px 14px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .header-title {
      font-family: 'DM Serif Display', serif;
      font-size: 26px;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--rose);
      margin-top: 2px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .header-date {
      font-size: 11px;
      color: var(--muted2);
      margin-top: 5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .tab-panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tab-panel::-webkit-scrollbar {
      display: none;
    }

    .tab-panel.active {
      display: flex;
    }

    /* ── Counter section ── */
    .counter-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 24px 12px;
      flex-shrink: 0;
    }

    .count-display {
      text-align: center;
      margin-bottom: 28px;
    }

    .count-number {
      display: block;
      font-family: 'DM Serif Display', serif;
      font-size: 100px;
      line-height: 1;
      color: var(--text);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .count-number.bump {
      transform: scale(1.1);
    }

    .count-label {
      display: block;
      font-size: 11px;
      color: var(--muted2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── Glow ring & button ── */
    .glow-ring {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow-ring::before {
      content: '';
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--rose-glow) 0%, transparent 68%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .glow-ring.lit::before {
      opacity: 1;
    }

    .counter-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid var(--rose);
      background: var(--rose-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition:
        background 0.2s ease,
        transform 0.1s ease;
      -webkit-appearance: none;
      appearance: none;
      user-select: none;
    }

    .counter-btn:active {
      transform: scale(0.95);
    }

    .counter-btn .btn-heart {
      font-size: 52px;
      color: var(--rose);
      user-select: none;
      pointer-events: none;
      line-height: 1;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(232, 116, 138, 0.25);
      animation: rippleOut 0.55s ease-out forwards;
      pointer-events: none;
      transform: scale(0);
    }

    @keyframes rippleOut {
      to { transform: scale(2.8); opacity: 0; }
    }

    .tap-hint {
      margin-top: 14px;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Kick list ── */
    .kicks-list {
      flex: 1;
      padding: 4px 16px 24px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 4px 10px;
    }

    .kick-item {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 6px;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .kick-time {
      flex: 1;
      font-family: 'DM Serif Display', serif;
      font-size: 19px;
      color: var(--text);
    }

    .kick-delete {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      flex-shrink: 0;
    }

    .kick-delete:active {
      background: rgba(232, 116, 138, 0.15);
      border-color: var(--rose);
      color: var(--rose);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 40px 24px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 36px;
      opacity: 0.3;
      margin-bottom: 10px;
    }

    .empty-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--muted2);
    }

    /* ── Tab bar ── */
    .tab-bar {
      flex-shrink: 0;
      display: flex;
      padding: 8px 16px env(safe-area-inset-bottom, 16px);
      background: var(--bg);
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 9px 8px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
      -webkit-appearance: none;
    }

    .tab-btn.active {
      background: var(--rose-soft);
      color: var(--rose);
    }

    .tab-svg {
      width: 22px;
      height: 22px;
    }

    /* ── History filter ── */
    .hist-filter {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      padding: 12px 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 12px;
    }

    .filter-chips::-webkit-scrollbar { display: none; }

    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted2);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-appearance: none;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--rose-soft);
      border-color: var(--rose);
      color: var(--rose);
    }

    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 12px;
    }

    .date-range input[type="date"] {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 8px 10px;
      -webkit-appearance: none;
      appearance: none;
      color-scheme: dark;
      min-width: 0;
    }

    .date-range-sep {
      color: var(--muted);
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Aggregate summary card */
    .agg-card {
      background: linear-gradient(135deg, rgba(232,116,138,0.10), rgba(232,116,138,0.03));
      border: 1px solid rgba(232,116,138,0.22);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .agg-title {
      font-size: 10px;
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .agg-total {
      font-family: 'DM Serif Display', serif;
      font-size: 56px;
      line-height: 1;
      color: var(--text);
    }

    .agg-total-label {
      font-size: 11px;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 2px;
      margin-bottom: 16px;
    }

    /* ── History ── */
    .history-list {
      padding: 16px 16px 24px;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
      animation: slideIn 0.2s ease-out;
    }

    .day-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .day-name {
      font-family: 'DM Serif Display', serif;
      font-size: 21px;
      color: var(--text);
      line-height: 1.1;
    }

    .day-date-sub {
      font-size: 11px;
      color: var(--muted2);
      margin-top: 3px;
      letter-spacing: 0.02em;
    }

    .day-total-wrap {
      text-align: right;
    }

    .day-total {
      font-family: 'DM Serif Display', serif;
      font-size: 44px;
      line-height: 1;
      color: var(--rose);
    }

    .day-total-label {
      font-size: 10px;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 14px;
    }

    .kpi-item {
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .kpi-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .kpi-value {
      font-family: 'DM Serif Display', serif;
      font-size: 17px;
      color: var(--text);
      line-height: 1.2;
    }

    /* 24hr distribution */
    .dist-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }

    .hour-bar {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 32px;
    }

    .hour-seg {
      flex: 1;
      border-radius: 2px 2px 0 0;
      background: var(--rose);
      min-height: 2px;
      opacity: 0.18;
      transition: opacity 0.2s ease;
    }

    .hour-seg.active {
      opacity: 1;
    }

    .hour-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    .hour-axis span {
      font-size: 9px;
      color: var(--muted);
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      justify-content: center;
      padding: 48px 0;
      gap: 6px;
    }

    .loading span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--rose);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    .loading span:nth-child(2) { animation-delay: 0.15s; }
    .loading span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotBounce {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.75); }
      40%           { opacity: 1;   transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-title">Helena Amaya</div>
    <div class="header-subtitle">her little kicks ♡</div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <!-- Main content -->
  <main class="main">

    <!-- Today tab -->
    <div class="tab-panel active" data-tab="today">
      <div class="counter-section">
        <div class="count-display">
          <span class="count-number" id="countNumber">—</span>
          <span class="count-label">Helena's kicks today</span>
        </div>
        <div class="glow-ring" id="glowRing">
          <button class="counter-btn" id="counterBtn" aria-label="Record kick">
            <span class="btn-heart">♡</span>
          </button>
        </div>
        <p class="tap-hint">tap each time Helena moves ♡</p>
      </div>
      <div class="kicks-list" id="kicksList">
        <div class="loading"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- History tab -->
    <div class="tab-panel" data-tab="history">
      <div class="hist-filter">
        <div class="filter-chips" id="filterChips">
          <button class="chip active" data-mode="all">All time</button>
          <button class="chip" data-mode="today">Today</button>
          <button class="chip" data-mode="week">This week</button>
          <button class="chip" data-mode="month">This month</button>
          <button class="chip" data-mode="custom">Custom</button>
        </div>
        <div class="date-range" id="dateRange" style="display:none">
          <input type="date" id="dateFrom" aria-label="From date">
          <span class="date-range-sep">—</span>
          <input type="date" id="dateTo" aria-label="To date">
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

  </main>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="today">
      <svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 3"/>
      </svg>
      Today
    </button>
    <button class="tab-btn" data-tab="history">
      <svg class="tab-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="18" rx="3"/>
        <path d="M8 2v4M16 2v4M3 10h18"/>
        <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
      </svg>
      History
    </button>
  </nav>

</div>

<script>
  // ── Config — replace with your Supabase project values ──
  const SUPABASE_URL     = 'https://elmewigpebwwswjdeits.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsbWV3aWdwZWJ3d3N3amRlaXRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MjY3ODcsImV4cCI6MjA4ODUwMjc4N30.wLo7V4cmuJwng4xWbZvzhCgLVhO860oSnIl9yt_EB1w';

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let todayKicks = [];
  let isAdding   = false;
  let histFilter = { mode: 'all', from: null, to: null };

  // ── Session key (device identifier) ──
  function getSessionKey() {
    let key = localStorage.getItem('baby_session_key');
    if (!key) {
      key = 'sk_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
      localStorage.setItem('baby_session_key', key);
    }
    return key;
  }

  // ── Formatting helpers ──
  function formatTime(dateStr) {
    return new Date(dateStr).toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', hour12: true
    });
  }

  function formatHourLabel(h) {
    if (h === 0)  return '12am';
    if (h === 12) return '12pm';
    return h > 12 ? `${h - 12}pm` : `${h}am`;
  }

  function formatDateParts(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return {
      dayName : d.toLocaleDateString('en-US', { weekday: 'long' }),
      full    : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
    };
  }

  // ── Supabase operations ──
  async function addKick() {
    if (isAdding) return;
    isAdding = true;

    const { data, error } = await client
      .from('kicks')
      .insert({ session_key: getSessionKey() })
      .select()
      .single();

    if (!error && data) {
      todayKicks.unshift(data);
      renderToday();
      animateCounter();
    }
    isAdding = false;
  }

  async function deleteKick(id) {
    const { error } = await client.from('kicks').delete().eq('id', id);
    if (!error) {
      todayKicks = todayKicks.filter(k => k.id !== id);
      renderToday();
    }
  }

  async function fetchTodayKicks() {
    const start = new Date();
    start.setHours(0, 0, 0, 0);

    const { data } = await client
      .from('kicks')
      .select('*')
      .eq('session_key', getSessionKey())
      .gte('kicked_at', start.toISOString())
      .order('kicked_at', { ascending: false });

    todayKicks = data || [];
    renderToday();
  }

  function getFilterDates() {
    const now = new Date();
    switch (histFilter.mode) {
      case 'today': {
        const s = new Date(); s.setHours(0, 0, 0, 0);
        const e = new Date(); e.setHours(23, 59, 59, 999);
        return { from: s.toISOString(), to: e.toISOString() };
      }
      case 'week': {
        const s = new Date(); s.setDate(now.getDate() - 6); s.setHours(0, 0, 0, 0);
        return { from: s.toISOString(), to: null };
      }
      case 'month': {
        const s = new Date(); s.setDate(now.getDate() - 29); s.setHours(0, 0, 0, 0);
        return { from: s.toISOString(), to: null };
      }
      case 'custom': {
        const from = histFilter.from ? new Date(histFilter.from + 'T00:00:00').toISOString() : null;
        const to   = histFilter.to   ? new Date(histFilter.to   + 'T23:59:59').toISOString() : null;
        return { from, to };
      }
      default: return { from: null, to: null };
    }
  }

  async function fetchHistory() {
    const el = document.getElementById('historyList');
    el.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';

    const { from, to } = getFilterDates();
    let query = client
      .from('kicks')
      .select('*')
      .eq('session_key', getSessionKey())
      .order('kicked_at', { ascending: true });

    if (from) query = query.gte('kicked_at', from);
    if (to)   query = query.lte('kicked_at', to);

    const { data } = await query;
    renderHistory(groupByDay(data || []));
  }

  // ── Grouping & KPIs ──
  function groupByDay(kicks) {
    return kicks.reduce((acc, k) => {
      const day = k.kicked_at.slice(0, 10);
      (acc[day] = acc[day] || []).push(k);
      return acc;
    }, {});
  }

  function calcKPIs(kicks) {
    const times = kicks.map(k => new Date(k.kicked_at)).sort((a, b) => a - b);
    const intervals = times.slice(1).map((t, i) => (t - times[i]) / 60000);
    const avgMin = intervals.length
      ? Math.round(intervals.reduce((s, v) => s + v, 0) / intervals.length)
      : null;

    const hourCounts = Array(24).fill(0);
    times.forEach(t => hourCounts[t.getHours()]++);
    const maxCount   = Math.max(...hourCounts);
    const busiestHr  = hourCounts.indexOf(maxCount);

    return {
      total      : kicks.length,
      first      : times[0],
      last       : times[times.length - 1],
      avgMin,
      busiestHr,
      hourCounts,
      maxCount,
    };
  }

  // ── Render: Today ──
  function renderToday() {
    document.getElementById('countNumber').textContent = todayKicks.length;

    const list = document.getElementById('kicksList');

    if (todayKicks.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">♡</div>
          <div class="empty-text">Helena hasn't moved yet today.<br>Tap the button each time she does.</div>
        </div>`;
      return;
    }

    const items = todayKicks.map(k => `
      <div class="kick-item" data-id="${k.id}">
        <div class="kick-time">${formatTime(k.kicked_at)}</div>
        <button class="kick-delete" onclick="deleteKick(${k.id})" aria-label="Remove kick">×</button>
      </div>`).join('');

    list.innerHTML = `<div class="section-label">Helena's kicks today ♡</div>` + items;
  }

  // ── Aggregate card (multi-day summary) ──
  function renderAggCard(grouped, days) {
    const allKicks  = days.flatMap(d => grouped[d]);
    const kpi       = calcKPIs(allKicks);
    const avgPerDay = Math.round(kpi.total / days.length);

    const busiestDay = days.reduce((best, d) =>
      grouped[d].length > grouped[best].length ? d : best, days[0]);
    const { full: busiestFull } = formatDateParts(busiestDay);

    const avgStr = kpi.avgMin !== null
      ? (kpi.avgMin < 60 ? `${kpi.avgMin} min` : `${Math.round(kpi.avgMin / 60)}h ${kpi.avgMin % 60}m`)
      : '—';

    const segs = kpi.hourCounts.map((count, h) => {
      const height = kpi.maxCount > 0 ? Math.max(2, Math.round((count / kpi.maxCount) * 28)) : 2;
      return `<div class="hour-seg ${count > 0 ? 'active' : ''}" style="height:${height}px"></div>`;
    }).join('');

    return `
      <div class="agg-card">
        <div class="agg-title">Helena's summary · ${days.length} days ♡</div>
        <div class="agg-total">${kpi.total}</div>
        <div class="agg-total-label">little kicks</div>
        <div class="kpi-grid">
          <div class="kpi-item">
            <div class="kpi-label">Avg per day</div>
            <div class="kpi-value">${avgPerDay}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Avg interval</div>
            <div class="kpi-value">${avgStr}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Most active hr</div>
            <div class="kpi-value">${formatHourLabel(kpi.busiestHr)}</div>
          </div>
          <div class="kpi-item">
            <div class="kpi-label">Busiest day</div>
            <div class="kpi-value" style="font-size:13px;line-height:1.3">${busiestFull}</div>
          </div>
        </div>
        <div class="dist-label">Helena's activity by hour</div>
        <div class="hour-bar">${segs}</div>
        <div class="hour-axis">
          <span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span>
        </div>
      </div>`;
  }

  // ── Render: History ──
  function renderHistory(grouped) {
    const el   = document.getElementById('historyList');
    const days = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

    if (days.length === 0) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">♡</div>
          <div class="empty-text">No kicks from Helena in this period.</div>
        </div>`;
      return;
    }

    const aggHTML = days.length > 1 ? renderAggCard(grouped, days) : '';

    el.innerHTML = aggHTML + days.map(day => {
      const kpi  = calcKPIs(grouped[day]);
      const { dayName, full } = formatDateParts(day);

      const avgStr = kpi.avgMin !== null
        ? (kpi.avgMin < 60 ? `${kpi.avgMin} min` : `${Math.round(kpi.avgMin / 60)}h ${kpi.avgMin % 60}m`)
        : '—';

      const segs = kpi.hourCounts.map((count, h) => {
        const pct    = kpi.maxCount > 0 ? count / kpi.maxCount : 0;
        const height = Math.max(2, Math.round(pct * 28));
        return `<div class="hour-seg ${count > 0 ? 'active' : ''}" style="height:${height}px" title="${formatHourLabel(h)}: ${count}"></div>`;
      }).join('');

      return `
        <div class="day-card">
          <div class="day-card-header">
            <div>
              <div class="day-name">${dayName}</div>
              <div class="day-date-sub">${full}</div>
            </div>
            <div class="day-total-wrap">
              <div class="day-total">${kpi.total}</div>
              <div class="day-total-label">little kicks</div>
            </div>
          </div>

          <div class="kpi-grid">
            <div class="kpi-item">
              <div class="kpi-label">First kick</div>
              <div class="kpi-value">${formatTime(kpi.first)}</div>
            </div>
            <div class="kpi-item">
              <div class="kpi-label">Last kick</div>
              <div class="kpi-value">${formatTime(kpi.last)}</div>
            </div>
            <div class="kpi-item">
              <div class="kpi-label">Avg interval</div>
              <div class="kpi-value">${avgStr}</div>
            </div>
            <div class="kpi-item">
              <div class="kpi-label">Most active</div>
              <div class="kpi-value">${formatHourLabel(kpi.busiestHr)}</div>
            </div>
          </div>

          <div class="dist-label">Helena's activity by hour</div>
          <div class="hour-bar">${segs}</div>
          <div class="hour-axis">
            <span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span>
          </div>
        </div>`;
    }).join('');
  }

  // ── Animations ──
  function animateCounter() {
    const numEl = document.getElementById('countNumber');
    const ring  = document.getElementById('glowRing');

    numEl.classList.add('bump');
    ring.classList.add('lit');

    setTimeout(() => numEl.classList.remove('bump'), 280);
    setTimeout(() => ring.classList.remove('lit'),   500);
  }

  function spawnRipple(e) {
    const btn  = document.getElementById('counterBtn');
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);

    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.cssText = `
      width:${size}px; height:${size}px;
      left:${clientX - rect.left - size / 2}px;
      top:${clientY - rect.top  - size / 2}px;
    `;
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 560);
  }

  // ── History filter handlers ──
  document.getElementById('filterChips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    histFilter.mode = chip.dataset.mode;
    const dateRange = document.getElementById('dateRange');
    dateRange.style.display = histFilter.mode === 'custom' ? 'flex' : 'none';
    if (histFilter.mode !== 'custom') fetchHistory();
  });

  document.getElementById('dateFrom').addEventListener('change', e => {
    histFilter.from = e.target.value;
    if (histFilter.from || histFilter.to) fetchHistory();
  });

  document.getElementById('dateTo').addEventListener('change', e => {
    histFilter.to = e.target.value;
    if (histFilter.from || histFilter.to) fetchHistory();
  });

  // ── Tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`.tab-panel[data-tab="${btn.dataset.tab}"]`).classList.add('active');
      if (btn.dataset.tab === 'history') fetchHistory();
    });
  });

  // ── Counter button ──
  const counterBtn = document.getElementById('counterBtn');

  counterBtn.addEventListener('click', e => {
    spawnRipple(e);
    addKick();
  });

  // prevent double-fire on touch devices
  counterBtn.addEventListener('touchend', e => e.preventDefault(), { passive: false });

  // ── Init ──
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  fetchTodayKicks();
</script>

</body>
</html>
